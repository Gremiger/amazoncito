<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Amazon → Argentina</title>
<style>body{font:14px system-ui;max-width:460px;margin:24px}label{display:block;margin:10px 0}input[type=number]{width:70px}</style>
</head><body>
<h1>Amazon → Argentina</h1>
<label>Perfil <input id="perfil" type="text"></label>
<label>Percepción Ganancias (%) <input id="percepcionGanancias" type="number" step="0.1"></label>
<label>Percepción IIBB (%) <input id="percepcionIibb" type="number" step="0.1"></label>
<label><input id="mostrarArs" type="checkbox"> Mostrar pesos con percepciones</label>
<label>Pedidos simultáneos <input id="concurrencia" type="number" min="1" max="6"></label>
<label>Listados <select id="modoListado"><option value="auto">Automático al ver la tarjeta</option><option value="hover">Solo al pasar el mouse</option></select></label>
<label>Productos que no envían a Argentina <select id="noEnvia"><option value="mostrar">Mostrar</option><option value="atenuar">Atenuar</option><option value="ocultar">Ocultar</option></select></label>
<p id="saved" hidden>Guardado ✓</p>
<script type="module" src="options.js"></script>
</body></html>
